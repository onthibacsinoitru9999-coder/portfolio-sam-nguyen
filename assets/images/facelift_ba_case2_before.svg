<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBA3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="skinToneCase2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDE2D0"/>
      <stop offset="70%" stop-color="#F2BE9F"/>
      <stop offset="100%" stop-color="#D99B77"/>
    </radialGradient>
  </defs>

  <rect width="600" height="700" fill="url(#bgGradBA3)"/>

  <!-- Face Front-Oblique (Before Endoscopic Lift) -->
  <g transform="translate(50, 40)">
    <!-- Hair -->
    <path d="M 130 180 Q 120 40 250 30 Q 380 35 410 160 Q 430 250 400 370 Q 370 480 330 520 L 170 520 Z" fill="#24140E"/>

    <!-- Neck -->
    <path d="M 210 380 Q 200 450 180 540 L 350 540 Q 330 450 310 380" fill="url(#skinToneCase2)"/>

    <!-- Face Silhouette (Early drooping of midface, flat cheek, crow's feet) -->
    <path d="M 210 110 Q 350 90 370 190 Q 385 270 365 330 Q 340 380 280 395 Q 220 395 190 340 Q 170 270 175 190 Z" fill="url(#skinToneCase2)"/>

    <!-- Flat cheek & tear trough depression -->
    <ellipse cx="235" cy="245" rx="30" ry="18" fill="#D99573" opacity="0.35"/>

    <!-- Drooping outer brow & Crow's feet -->
    <g transform="translate(210, 180)">
      <path d="M 10 5 Q 40 -8 75 -2 Q 95 10 100 22" fill="none" stroke="#3D271D" stroke-width="4.5"/>
      <path d="M 20 25 Q 50 10 80 24" fill="none" stroke="#5A3525" stroke-width="2"/>
      <ellipse cx="50" cy="24" rx="12" ry="9" fill="#422E1B"/>
      <circle cx="53" cy="21" r="3" fill="#FFF"/>
      <!-- Crow's feet wrinkles -->
      <path d="M 85 22 L 105 15" stroke="#9A6142" stroke-width="2"/>
      <path d="M 88 26 L 110 26" stroke="#9A6142" stroke-width="2"/>
      <path d="M 85 30 L 105 38" stroke="#9A6142" stroke-width="2"/>
    </g>

    <!-- Nasolabial Fold (Moderate) -->
    <path d="M 205 260 Q 195 295 210 325" fill="none" stroke="#9A6142" stroke-width="3.5" opacity="0.7"/>

    <!-- Ear Region (Intact but patient worried about visible scars) -->
    <path d="M 350 225 Q 375 220 370 260 Q 370 295 350 310 Z" fill="#E8B599" stroke="#C98B68" stroke-width="1.5"/>
  </g>

  <!-- Tag -->
  <g transform="translate(30, 40)">
    <rect width="180" height="34" rx="6" fill="#DC2626" opacity="0.9"/>
    <text x="90" y="22" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900">TRƯỚC NỘI SOI</text>
  </g>

  <g transform="translate(30, 610)">
    <rect width="540" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#F87171" font-family="sans-serif" font-size="12" font-weight="bold">● Bệnh nhân Nữ, 39 tuổi — Nỗi sợ sẹo phẫu thuật:</text>
    <text x="20" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11.5">Sa trễ tầng giữa mặt, đuôi mắt cụp mệt mỏi. Yêu cầu: Trẻ hóa tối đa nhưng 100% KHÔNG CÓ SẸO Ở TAI.</text>
  </g>
</svg>
