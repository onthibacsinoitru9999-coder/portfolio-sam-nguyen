<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="smasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="nerveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="520" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="360" height="32" rx="6" fill="#1E293B" stroke="#D97706" stroke-width="1"/>
    <text x="180" y="21" text-anchor="middle" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5">SƠ ĐỒ GIẢI PHẪU DEEP PLANE FACELIFT HOA KỲ</text>
  </g>

  <!-- Face Profile Line Illustration -->
  <g transform="translate(60, 80)">
    <!-- Face Silhouette Outline -->
    <path d="M 120 40 Q 140 10 180 15 Q 230 20 250 50 Q 270 75 280 110 Q 285 130 300 155 Q 310 170 310 185 Q 295 195 280 200 Q 295 230 290 250 Q 275 270 250 290 Q 230 305 190 320 Q 150 335 120 370 Q 110 380 90 390" 
          fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- Ear Outline -->
    <path d="M 135 170 Q 155 160 160 185 Q 165 210 150 235 Q 138 250 135 240 Z" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>

    <!-- 1. SMAS Layer (Blue Zone) -->
    <path d="M 155 120 Q 210 110 240 140 Q 255 170 245 220 Q 220 270 170 285 Q 140 250 155 120 Z" 
          fill="url(#smasGrad)" opacity="0.35" stroke="#38BDF8" stroke-width="2"/>
    <text x="195" y="150" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">Lớp SMAS</text>

    <!-- 2. Malar Fat Pad (Cheek) -->
    <ellipse cx="235" cy="180" rx="26" ry="20" fill="#F59E0B" opacity="0.65" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="235" y="184" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">Khối Mỡ Má</text>

    <!-- 3. Retaining Ligaments (Green Anchors - Released in Deep Plane) -->
    <!-- Zygomatic Ligament -->
    <g transform="translate(215, 145)">
      <circle r="7" fill="#10B981" stroke="#A7F3D0" stroke-width="1.5"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-5" y1="5" x2="5" y2="-5" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <!-- Masseteric Ligament -->
    <g transform="translate(185, 215)">
      <circle r="7" fill="#10B981" stroke="#A7F3D0" stroke-width="1.5"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-5" y1="5" x2="5" y2="-5" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <!-- Mandibular Ligament -->
    <g transform="translate(210, 275)">
      <circle r="7" fill="#10B981" stroke="#A7F3D0" stroke-width="1.5"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-5" y1="5" x2="5" y2="-5" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- 4. Facial Nerve Branches (Yellow Pathways - Deep Safe Plane) -->
    <path d="M 145 200 Q 170 190 200 170" fill="none" stroke="url(#nerveGrad)" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M 145 200 Q 175 215 210 210" fill="none" stroke="url(#nerveGrad)" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M 145 200 Q 165 240 195 255" fill="none" stroke="url(#nerveGrad)" stroke-width="2" stroke-dasharray="3,2"/>

    <!-- 5. Vertical Vector Arrows (Gold) -->
    <g stroke="url(#gold)" stroke-width="3" fill="none">
      <!-- Cheek vector -->
      <path d="M 235 175 Q 220 120 195 80" marker-end="url(#arrowGold)"/>
      <polygon points="195,73 188,86 202,84" fill="#FDE68A"/>
      <!-- Jawline vector -->
      <path d="M 210 270 Q 180 230 160 170"/>
      <polygon points="160,163 154,176 168,173" fill="#FDE68A"/>
    </g>

    <text x="210" y="70" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="bold">Vector Treo Thẳng Đứng</text>
  </g>

  <!-- Right Side: Explanatory Anatomy Panels -->
  <g transform="translate(420, 80)">
    <!-- Box 1: Deep Plane vs Traditional -->
    <rect width="350" height="115" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="25" cy="25" r="10" fill="#D97706"/>
    <text x="25" y="29" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">1</text>
    <text x="45" y="29" fill="#FDE68A" font-family="sans-serif" font-size="13" font-weight="bold">Giải Phóng Dây Chằng Giữ Mặt</text>
    <text x="20" y="55" fill="#94A3B8" font-family="sans-serif" font-size="11.5" width="310">
      <tspan x="20" dy="0">Dây chằng gò má (Zygomatic) &amp; cơ cắn (Masseteric)</tspan>
      <tspan x="20" dy="18">được bóc tách giải phóng hoàn toàn, giúp mô mềm</tspan>
      <tspan x="20" dy="18">dời lên cao tự do mà KHÔNG hề tạo sức căng trên da.</tspan>
    </text>

    <!-- Box 2: An Toàn Vi Phẫu & Dây Thần Kinh -->
    <g transform="translate(0, 130)">
      <rect width="350" height="115" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="25" cy="25" r="10" fill="#0284C7"/>
      <text x="25" y="29" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">2</text>
      <text x="45" y="29" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="bold">Bảo Tồn Dây Thần Kinh Mặt Tuyệt Đối</text>
      <text x="20" y="55" fill="#94A3B8" font-family="sans-serif" font-size="11.5">
        <tspan x="20" dy="0">Bác sĩ vi phẫu Viện TW đi đúng khoang vô mạch</tspan>
        <tspan x="20" dy="18">dưới lớp SMAS, bảo vệ trọn vẹn các nhánh thần</tspan>
        <tspan x="20" dy="18">kinh VII. Biểu cảm nụ cười tự nhiên 100%.</tspan>
      </text>
    </g>

    <!-- Box 3: Độ Bền 10 Năm Vượt Trội -->
    <g transform="translate(0, 260)">
      <rect width="350" height="120" rx="10" fill="#0F172A" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="25" cy="25" r="10" fill="#10B981"/>
      <text x="25" y="29" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">3</text>
      <text x="45" y="29" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="bold">Cơ Sở Y Khoa Của Bảo Hành 10 Năm</text>
      <text x="20" y="55" fill="#94A3B8" font-family="sans-serif" font-size="11.5">
        <tspan x="20" dy="0">Khác với căng da kéo nông (chùng lại sau 1-2 năm),</tspan>
        <tspan x="20" dy="18">Deep Plane tái cấu trúc nền móng cơ &amp; màng xương,</tspan>
        <tspan x="20" dy="18">dính liền sinh học vĩnh viễn, duy trì nét thanh xuân</tspan>
        <tspan x="20" dy="18" fill="#FDE68A" font-weight="bold">bền vững trên 10 năm được kiểm chứng tại Mỹ.</tspan>
      </text>
    </g>
  </g>
</svg>
