<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBA2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <radialGradient id="skinToneAfter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="#0B1528"/>

  <!-- Clinical Grid -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <!-- Patient Structure - After Deep Plane Facelift (Youthful, Clean, Lifted) -->
  <g transform="translate(40, 30)">
    <!-- Glossy Hair -->
    <path d="M 120 180 Q 110 40 250 30 Q 400 25 440 150 Q 460 230 440 340 Q 410 440 380 480 Q 300 450 270 410 Q 230 450 170 500 L 100 510 Z" fill="#3B2317"/>

    <!-- Neck & Jaw (SNATCHED 90-degree Sharp Jawline, Smooth Tight Neck) -->
    <!-- Tight, youthfully contoured neck without platysmal bands -->
    <path d="M 230 350 Q 240 430 220 540 L 370 550 Q 365 420 340 360" fill="#FCE7D6"/>

    <!-- Firm, Sculpted Face (Heart-shaped jawline) -->
    <!-- Crisp mandibular border -->
    <path d="M 230 90 Q 380 70 400 180 Q 410 250 395 305 Q 365 350 300 365 Q 240 365 210 335 Q 175 280 180 220 Q 180 140 230 90 Z" fill="#FCE7D6"/>

    <!-- High, Sculpted Cheekbone (Malar Elevation) -->
    <ellipse cx="260" cy="220" rx="35" ry="25" fill="#FED7AA" opacity="0.45"/>

    <!-- Natural Tragus / Ear (Zero scar, normal anatomical position, NO PIXIE EAR) -->
    <path d="M 370 215 Q 398 205 395 245 Q 395 280 375 295 Z" fill="#FBD5BC" stroke="#D79573" stroke-width="1.5"/>

    <!-- Eyes (Bright, open, lifted temporal brow, youthful almond contour) -->
    <g transform="translate(235, 185)">
      <!-- Eyebrow (Elegant arch, lifted tail) -->
      <path d="M 0 5 Q 35 -15 70 -12 Q 85 -5 95 0" fill="none" stroke="#3D271D" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Eye contour -->
      <path d="M 15 15 Q 45 3 75 16" fill="none" stroke="#683F2C" stroke-width="2.5"/>
      <ellipse cx="45" cy="17" rx="14" ry="10" fill="#4B3621"/>
      <circle cx="48" cy="14" r="4.5" fill="#FFFFFF"/>
      <circle cx="42" cy="20" r="1.5" fill="#FFFFFF"/>
      <!-- Smooth lower eyelid (Zero bags, zero hollows) -->
      <path d="M 15 22 Q 45 28 75 22" fill="none" stroke="#D79573" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Refined Nose -->
    <path d="M 215 175 Q 195 235 185 270 Q 200 280 215 265" fill="none" stroke="#D79573" stroke-width="2.5"/>

    <!-- Nasolabial Fold (Completely flattened & smoothed by malar repositioning) -->
    <path d="M 213 260 Q 206 285 220 305" fill="none" stroke="#D79573" stroke-width="1.5" opacity="0.3"/>

    <!-- Youthful Upturned Lips (Full volume, no marionette sag) -->
    <g transform="translate(200, 305)">
      <path d="M 5 8 Q 25 5 45 8" fill="none" stroke="#DC2626" stroke-width="3" opacity="0.8"/>
      <!-- Slight natural smile curve -->
      <path d="M 5 8 Q 0 5 0 2" fill="none" stroke="#DC2626" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Jawline Definition Line (Crisp) -->
    <path d="M 210 335 Q 260 365 350 330" fill="none" stroke="#D79573" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Green Badge / Header -->
  <g transform="translate(30, 40)">
    <rect width="210" height="34" rx="6" fill="#059669" opacity="0.95"/>
    <text x="105" y="22" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" letter-spacing="1">SAU MỔ · DEEP PLANE</text>
  </g>

  <!-- Rejuvenation Metrics Tag -->
  <g transform="translate(420, 40)">
    <rect width="150" height="34" rx="6" fill="#1E293B" stroke="#D97706" stroke-width="1"/>
    <text x="75" y="22" text-anchor="middle" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">TRẺ LẠI 12 - 15 TUỔI</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(30, 610)">
    <rect width="540" height="65" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="20" y="24" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold">✓ Kết quả 6 tháng hậu phẫu — Thực hiện bởi ThS.BS Viện Trung Ương:</text>
    <text x="20" y="44" fill="#E2E8F0" font-family="sans-serif" font-size="11.5">Gò má nâng cao tự nhiên, xóa sạch rãnh cười &amp; rãnh marionette, viền hàm sắc nét, không sẹo lộ trước tai.</text>
  </g>
</svg>
