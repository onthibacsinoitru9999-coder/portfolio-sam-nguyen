<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1329" rx="16"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CHẨN ĐOÁN HÌNH ẢNH: 3 CUNG GILULA & GÓC THUYỀN - NGUYỆT</text>
  <text x="400" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Đánh giá Mất vững Phân ly (DISI / VISI) trên X-quang Chuẩn</text>

  <!-- Left: AP Gilula Arches -->
  <g transform="translate(40, 90)">
    <rect width="330" height="320" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="165" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3 CUNG GILULA TRÊN PHIM PA</text>
    
    <!-- Bones outline -->
    <path d="M 60,260 C 120,240 220,240 270,260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <!-- Arch 1 -->
    <path d="M 80,180 C 130,130 210,130 250,170" stroke="#22c55e" stroke-width="3.5" fill="none"/>
    <text x="165" y="135" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cung I: Bờ gần Thuyền - Nguyệt - Tháp</text>
    
    <!-- Arch 2 -->
    <path d="M 100,205 C 140,165 200,165 230,195" stroke="#3b82f6" stroke-width="3" fill="none"/>
    <text x="165" y="180" fill="#93c5fd" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cung II: Bờ xa Thuyền - Nguyệt - Tháp</text>
    
    <!-- Arch 3 -->
    <path d="M 130,130 C 160,95 200,95 220,130" stroke="#eab308" stroke-width="3" fill="none"/>
    <text x="175" y="90" fill="#fde047" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cung III: Bờ gần Cả - Móc</text>
    
    <text x="165" y="270" fill="#f87171" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">⚠️ Đứt đoạn cung = Trật / Gãy xương cổ tay</text>
    <text x="165" y="295" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Khe Thuyền - Nguyệt bình thường &lt; 2mm (&gt;3mm: Terry Thomas)</text>
  </g>

  <!-- Right: Lateral SL Angle & DISI/VISI -->
  <g transform="translate(420, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="170" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GÓC THUYỀN - NGUYỆT (LATERAL VIEW)</text>
    
    <!-- Lunate & Scaphoid Axes -->
    <line x1="80" y1="200" x2="260" y2="100" stroke="#f43f5e" stroke-width="3"/>
    <text x="240" y="90" fill="#fb7185" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Trục Xương Thuyền</text>
    
    <line x1="170" y1="60" x2="170" y2="240" stroke="#38bdf8" stroke-width="3"/>
    <text x="170" y="255" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Trục Xương Nguyệt</text>
    
    <!-- Angle Arc -->
    <path d="M 170,150 A 40 40 0 0 0 205,130" stroke="#facc15" stroke-width="2.5" fill="none"/>
    <text x="210" y="160" fill="#fef08a" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Góc SL: 30° - 60°</text>
    
    <rect x="20" y="210" width="300" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="235" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• DISI (Góc SL &gt; 60°):</text>
    <text x="170" y="235" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Rách SLIL, Nguyệt ngửa lưng</text>
    <text x="35" y="260" fill="#93c5fd" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• VISI (Góc SL &lt; 30°):</text>
    <text x="170" y="260" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Rách LTIL, Nguyệt gập gan</text>
    <text x="35" y="285" fill="#86efac" font-family="Inter, sans-serif" font-size="10">• Trục Nguyệt - Quay (RL angle): Bình thường 0° ± 15°</text>
  </g>
</svg>