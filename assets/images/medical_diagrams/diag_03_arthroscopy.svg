<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a" rx="16"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">BẢN ĐỒ CỔNG NỘI SOI KHỚP CỔ TAY (WRIST ARTHROSCOPY)</text>
  <text x="400" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Vị trí các Cổng Quay - Cổ tay (RC) & Gian cổ tay (MC) theo Mốc Gân duỗi</text>

  <!-- Wrist Dorsal Outline -->
  <path d="M 200,380 L 200,240 C 200,180 300,140 400,140 C 500,140 600,180 600,240 L 600,380 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Lister's Tubercle -->
  <circle cx="340" cy="270" r="10" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
  <text x="340" y="300" fill="#fde047" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Củ Lister</text>

  <!-- Extensor Tendon Lines -->
  <!-- EPL (Compartment 3) -->
  <path d="M 340,380 L 335,270 L 250,160" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="245" y="145" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Gân EPL (Khoang 3)</text>

  <!-- EDC (Compartment 4) -->
  <path d="M 400,380 L 400,150" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="400" y="135" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Gân EDC (Khoang 4)</text>

  <!-- ECU (Compartment 6) -->
  <path d="M 550,380 L 550,180" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="550" y="165" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Gân ECU (Khoang 6)</text>

  <!-- Portals -->
  <!-- 3-4 Portal -->
  <circle cx="370" cy="240" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
  <text x="370" y="245" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3-4</text>
  <text x="370" y="220" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cổng Nhìn Chính</text>

  <!-- 4-5 Portal -->
  <circle cx="450" cy="235" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
  <text x="450" y="240" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4-5</text>
  <text x="450" y="215" fill="#93c5fd" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cổng Thao Tác</text>

  <!-- 6R Portal -->
  <circle cx="530" cy="245" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <text x="530" y="249" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">6R</text>
  <text x="530" y="275" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Soi TFCC</text>

  <!-- 6U Portal -->
  <circle cx="575" cy="255" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <text x="575" y="259" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">6U</text>

  <!-- Midcarpal Portals: MCR & MCU -->
  <!-- MCR -->
  <circle cx="370" cy="180" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <text x="370" y="184" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MCR</text>

  <!-- MCU -->
  <circle cx="450" cy="175" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="179" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MCU</text>
  <text x="410" y="165" fill="#d8b4fe" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Khớp Gian Cổ Tay (Midcarpal)</text>

  <!-- Safety Warning -->
  <rect x="180" y="395" width="440" height="40" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="400" y="420" fill="#fecaca" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚠️ Kỹ thuật "Skin-only" tránh phạm nhánh nông TK quay (SBRN) &amp; nhánh mu TK trụ (DRUBN)</text>
</svg>