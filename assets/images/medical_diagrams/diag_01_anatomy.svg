<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ligGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad1)" rx="16"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SƠ ĐỒ GIẢI PHẪU DÂY CHẰNG & KHỐI XƯƠNG CỔ TAY</text>
  <text x="400" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Carpal Bones & Intrinsic / Extrinsic Ligament Complex (Campbell 13th Ed)</text>
  
  <!-- Radius & Ulna -->
  <path d="M 220,400 L 220,290 C 220,270 330,260 380,260 L 380,400 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="300" y="350" fill="#93c5fd" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">XƯƠNG QUAY (Radius)</text>
  <text x="300" y="370" fill="#bfdbfe" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">80% Tải lực nén</text>

  <path d="M 420,400 L 420,280 C 440,280 500,285 540,295 L 540,400 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="350" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">XƯƠNG TRỤ (Ulna)</text>
  <text x="480" y="370" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">20% Tải lực (qua TFCC)</text>

  <!-- TFCC -->
  <path d="M 400,275 C 440,265 520,275 540,290 C 510,260 450,260 400,275 Z" fill="#f59e0b" opacity="0.85"/>
  <text x="470" y="270" fill="#fcd34d" font-family="Inter, sans-serif" font-size="11" font-weight="bold">TFCC Complex</text>

  <!-- Proximal Row -->
  <!-- Scaphoid -->
  <ellipse cx="280" cy="210" rx="35" ry="45" transform="rotate(-25 280 210)" fill="url(#boneGrad)" stroke="#bae6fd" stroke-width="2"/>
  <text x="275" y="215" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">X. THUYỀN</text>
  <text x="275" y="230" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Scaphoid)</text>

  <!-- Lunate -->
  <path d="M 350,190 C 350,170 410,170 410,190 C 410,225 350,225 350,190 Z" fill="url(#boneGrad)" stroke="#bae6fd" stroke-width="2"/>
  <text x="380" y="200" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">X. NGUYỆT</text>
  <text x="380" y="215" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Lunate)</text>

  <!-- Triquetrum & Pisiform -->
  <ellipse cx="465" cy="195" rx="25" ry="25" fill="url(#boneGrad)" stroke="#bae6fd" stroke-width="2"/>
  <text x="465" y="195" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">X. THÁP</text>
  <circle cx="490" cy="205" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="490" y="209" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">ĐẬU</text>

  <!-- SLIL Ligament -->
  <path d="M 310,195 L 355,195" stroke="url(#ligGrad)" stroke-width="6" stroke-linecap="round"/>
  <text x="332" y="185" fill="#fda4af" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SLIL (Dorsal)</text>

  <!-- LTIL Ligament -->
  <path d="M 405,198 L 442,198" stroke="url(#ligGrad)" stroke-width="5" stroke-linecap="round"/>
  <text x="424" y="185" fill="#fda4af" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LTIL</text>

  <!-- Distal Row -->
  <ellipse cx="230" cy="120" rx="22" ry="25" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="230" y="124" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">THANG</text>

  <ellipse cx="275" cy="125" rx="20" ry="22" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="275" y="129" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">THÊ</text>

  <ellipse cx="360" cy="120" rx="35" ry="40" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="120" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">XƯƠNG CẢ</text>
  <text x="360" y="135" fill="#bae6fd" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">(Capitate Head)</text>

  <ellipse cx="450" cy="125" rx="28" ry="30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="129" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">X. MÓC</text>

  <!-- Legend Box -->
  <rect x="580" y="100" width="200" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="595" y="125" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">CHÚ GIẢI LÂM SÀNG</text>
  <line x1="595" y1="135" x2="765" y2="135" stroke="#334155"/>
  <rect x="595" y="150" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="618" y="162" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Hàng cổ tay 1 (Nội suy)</text>
  <rect x="595" y="180" width="14" height="14" rx="3" fill="#0284c7"/>
  <text x="618" y="192" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Hàng cổ tay 2 (Cố định)</text>
  <rect x="595" y="210" width="14" height="6" rx="2" fill="#f43f5e"/>
  <text x="618" y="218" fill="#fda4af" font-family="Inter, sans-serif" font-size="11">Dây chằng SLIL / LTIL</text>
  <rect x="595" y="235" width="14" height="10" rx="2" fill="#f59e0b"/>
  <text x="618" y="244" fill="#fcd34d" font-family="Inter, sans-serif" font-size="11">Phức hợp TFCC</text>
  <text x="595" y="280" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-style="italic">Trục Dart-thrower's:&#10;Bảo tồn vững hàng 1</text>
</svg>