<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a" rx="16"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">PHẪU THUẬT CỨU VÃN THOÁI HÓA CỔ TAY (SLAC / SNAC WRIST)</text>
  <text x="400" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">So sánh Kỹ thuật Cắt hàng cổ tay thứ nhất (PRC) vs Hàn 4 góc xương (Four-Corner Fusion)</text>

  <!-- Left: PRC -->
  <g transform="translate(40, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="170" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CẮT HÀNG CỔ TAY 1 (PRC - 69-21)</text>
    
    <!-- Schematic -->
    <rect x="30" y="55" width="280" height="130" rx="8" fill="#0f172a"/>
    <text x="45" y="80" fill="#ef4444" font-family="Inter, sans-serif" font-size="11" font-weight="bold">❌ Cắt bỏ 3 xương:</text>
    <text x="170" y="80" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11">Thuyền + Nguyệt + Tháp</text>
    <text x="45" y="105" fill="#22c55e" font-family="Inter, sans-serif" font-size="11" font-weight="bold"> khớp mới:</text>
    <text x="145" y="105" fill="#86efac" font-family="Inter, sans-serif" font-size="11">Chỏm Cả khớp Hố Nguyệt X.Quay</text>
    <text x="45" y="130" fill="#f59e0b" font-family="Inter, sans-serif" font-size="10" font-weight="bold">⚠️ Điều kiện tiên quyết:</text>
    <text x="45" y="148" fill="#fde047" font-family="Inter, sans-serif" font-size="10">Sụn chỏm Xương Cả &amp; Hố Nguyệt phải nguyên vẹn</text>
    <text x="45" y="168" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10">Bảo tồn dây chằng RSC mặt gan</text>

    <!-- Outcomes -->
    <text x="30" y="210" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="bold">KẾT QUẢ PHỤC HỒI:</text>
    <text x="30" y="235" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Tầm vận động: Giữ 60% - 70% bên lành</text>
    <text x="30" y="255" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Lực nắm tay: Đạt ~70% bên lành</text>
    <text x="30" y="275" fill="#4ade80" font-family="Inter, sans-serif" font-size="11">• KHÔNG CÓ NGUY CƠ KHỚP GIẢ (Nonunion = 0%)</text>
  </g>

  <!-- Right: Four-Corner Fusion -->
  <g transform="translate(420, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#a855f7"/>
    <text x="170" y="30" fill="#c084fc" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HÀN 4 GÓC XƯƠNG (4CF - 69-52)</text>
    
    <!-- Schematic -->
    <rect x="30" y="55" width="280" height="130" rx="8" fill="#0f172a"/>
    <text x="45" y="80" fill="#ef4444" font-family="Inter, sans-serif" font-size="11" font-weight="bold">❌ Cắt bỏ:</text>
    <text x="120" y="80" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11">Toàn bộ Xương Thuyền</text>
    <text x="45" y="105" fill="#a855f7" font-family="Inter, sans-serif" font-size="11" font-weight="bold">🔒 Hàn 4 xương:</text>
    <text x="145" y="105" fill="#d8b4fe" font-family="Inter, sans-serif" font-size="11">Cả + Móc + Nguyệt + Tháp</text>
    <text x="45" y="130" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Phương tiện kết hợp:</text>
    <text x="45" y="148" fill="#bae6fd" font-family="Inter, sans-serif" font-size="10">Nẹp tròn chuyên dụng (Circular Plate) hoặc Vít nén</text>
    <text x="45" y="168" fill="#fde047" font-family="Inter, sans-serif" font-size="10">Sửa góc DISI xương nguyệt về 0° trước khi hàn</text>

    <!-- Outcomes -->
    <text x="30" y="210" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="bold">KẾT QUẢ PHỤC HỒI:</text>
    <text x="30" y="235" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">• Tầm vận động: Giữ 45% - 55% bên lành</text>
    <text x="30" y="255" fill="#4ade80" font-family="Inter, sans-serif" font-size="11">• Lực nắm tay: ĐẠT 80% - 85% BÊN LÀNH (Mạnh hơn PRC)</text>
    <text x="30" y="275" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11">• Nguy cơ chậm liền / khớp giả: 3% - 8%</text>
  </g>
</svg>