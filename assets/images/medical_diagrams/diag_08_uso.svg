<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a" rx="16"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">XUNG ĐỘT TRỤ - CỔ TAY &amp; PHẪU THUẬT ĐẦU DƯỚI XƯƠNG TRỤ</text>
  <text x="400" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Kỹ thuật Cắt ngắn xương trụ USO (Technique 69-34) &amp; Phẫu thuật Sauvé-Kapandji (69-39)</text>

  <!-- Left: USO -->
  <g transform="translate(40, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="170" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CẮT NGẮN THÂN XƯƠNG TRỤ (USO - 69-34)</text>
    
    <rect x="20" y="50" width="300" height="250" rx="8" fill="#0f172a"/>
    <text x="35" y="75" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• Tiêu chuẩn vàng:</text>
    <text x="145" y="75" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">Khớp DRUJ còn nguyên vẹn</text>
    
    <text x="35" y="100" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• Đường cắt nêm chéo 45°:</text>
    <text x="35" y="120" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">- Tăng gấp đôi diện tích tiếp xúc xương liền can</text>
    <text x="35" y="138" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">- Bắt thêm 1 vít nén ép (lag screw) qua ổ cắt</text>
    <text x="35" y="156" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">- Lấy bỏ 2 - 4 mm xương đưa Ulnar Variance về 0</text>

    <text x="35" y="185" fill="#fde047" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• Lợi thế vượt trội:</text>
    <text x="35" y="205" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Làm căng lại dây chằng DRUJ, tăng độ vững khớp</text>
    <text x="35" y="225" fill="#86efac" font-family="Inter, sans-serif" font-size="10">Giữ nguyên diện sụn chỏm trụ và đĩa sụn TFCC</text>
    
    <text x="35" y="255" fill="#f87171" font-family="Inter, sans-serif" font-size="10" font-weight="bold">Biến chứng: Khớp giả thân trụ 2-5% (Tránh bằng cố định vững)</text>
  </g>

  <!-- Right: Sauve-Kapandji -->
  <g transform="translate(420, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#a855f7"/>
    <text x="170" y="30" fill="#c084fc" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PHẪU THUẬT SAUVÉ-KAPANDJI (69-39)</text>
    
    <rect x="20" y="50" width="300" height="250" rx="8" fill="#0f172a"/>
    <text x="35" y="75" fill="#ef4444" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• Chỉ định:</text>
    <text x="100" y="75" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11">Thoái hóa nặng DRUJ ở NGƯỜI TRẺ</text>
    
    <text x="35" y="105" fill="#a855f7" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• Nguyên lý 2 thì kết hợp:</text>
    <text x="35" y="125" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">1. Hàn cứng khớp DRUJ (Bắt 2 vít nén xốp 3.5mm)</text>
    <text x="35" y="145" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">2. Cắt đoạn 1.5 cm thân xương trụ phía trên ổ hàn</text>
    
    <text x="35" y="175" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="bold">• Mục tiêu phục hồi:</text>
    <text x="35" y="195" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">- Tạo khớp giả chức năng cho phép sấp ngửa cẳng tay</text>
    <text x="35" y="215" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">- Bảo tồn nâng đỡ cổ tay phía trụ (không tụt carpus)</text>
    
    <text x="35" y="250" fill="#fde047" font-family="Inter, sans-serif" font-size="10" font-weight="bold">So với Darrach: Vững hơn, chịu lực nặng tốt hơn</text>
  </g>
</svg>