<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a" rx="16"/>
  <text x="400" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">PHỨC HỢP SỤN SỢI TAM GIÁC (TFCC) &amp; KHÂU ĐÍNH HỐ TRỤ</text>
  <text x="400" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Phân loại Palmer (1A-1D, 2A-2E) &amp; Arthroscopic Transosseous Foveal Repair (Technique 69-27)</text>

  <!-- Left: Palmer Classification -->
  <g transform="translate(40, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#f59e0b"/>
    <text x="170" y="30" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PHÂN LOẠI PALMER (CHẤN THƯƠNG)</text>
    
    <rect x="20" y="50" width="300" height="55" rx="6" fill="#0f172a"/>
    <text x="30" y="70" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Class 1A - Rách Trung Tâm:</text>
    <text x="30" y="90" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Vô mạch, không tự liền &rarr; Cắt lọc Shaver qua nội soi</text>

    <rect x="20" y="115" width="300" height="60" rx="6" fill="#0f172a"/>
    <text x="30" y="135" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Class 1B - Nhổ Bờ Trụ / Hố Trụ:</text>
    <text x="30" y="152" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Có mạch nuôi tốt &rarr; Khâu đính bao khớp (DRUJ vững)</text>
    <text x="30" y="167" fill="#86efac" font-family="Inter, sans-serif" font-size="10">hoặc Khâu xuyên xương Hố trụ (DRUJ mất vững)</text>

    <rect x="20" y="185" width="300" height="55" rx="6" fill="#0f172a"/>
    <text x="30" y="205" fill="#f43f5e" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Class 1C - Rách Dây chằng Gan tay:</text>
    <text x="30" y="225" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Rách UL/UT ligament &rarr; Phẫu thuật mổ mở khâu dây chằng</text>

    <rect x="20" y="250" width="300" height="55" rx="6" fill="#0f172a"/>
    <text x="30" y="270" fill="#c084fc" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Class 1D - Nhổ Bờ Xương Quay:</text>
    <text x="30" y="290" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Kèm gãy mỏm trâm quay &rarr; Khâu xuyên xương hố Sigma</text>
  </g>

  <!-- Right: Foveal Repair Technique -->
  <g transform="translate(420, 90)">
    <rect width="340" height="320" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="170" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">KỸ THUẬT KHÂU XUYÊN XƯƠNG HỐ TRỤ (69-27)</text>
    
    <rect x="20" y="55" width="300" height="245" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="80" fill="#fde047" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Các bước thực hiện chuẩn:</text>
    
    <text x="35" y="105" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">1. Soi cổng 3-4, làm sạch diện rách TFCC bờ trụ</text>
    <text x="35" y="130" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">2. Khoan đường hầm 2.0mm từ vỏ xương trụ vào đáy Fovea</text>
    <text x="35" y="155" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">3. Luồn chỉ FiberWire 2-0 qua TFCC đính vào hố trụ</text>
    <text x="35" y="180" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">4. Luồn 2 đầu chỉ qua đường hầm xương trụ ra ngoài</text>
    <text x="35" y="205" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="bold">5. Buộc chỉ trên cúc Endobutton khi cẳng tay NGỬA 30°</text>

    <line x1="35" y1="225" x2="305" y2="225" stroke="#334155"/>
    <text x="35" y="245" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Hậu phẫu:</text>
    <text x="35" y="265" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Bột cánh bàn tay khuỷu 90° ngửa 30° trong 4 TUẦN</text>
    <text x="35" y="285" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">(Bảo vệ tối đa đường khâu chống xoay sấp cẳng tay)</text>
  </g>
</svg>