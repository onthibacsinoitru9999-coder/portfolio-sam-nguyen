<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="skinToneBefore" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FCDCC8"/>
      <stop offset="70%" stop-color="#F1C2A5"/>
      <stop offset="100%" stop-color="#DDA080"/>
    </radialGradient>
    <filter id="blurShadow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bgGradBA)"/>

  <!-- Clinical Grid Background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <!-- Patient Head & Neck Structure (Profile 45-degree angle - Before) -->
  <g transform="translate(40, 30)">
    <!-- Hair background -->
    <path d="M 120 180 Q 110 50 250 40 Q 390 35 430 160 Q 450 240 430 350 Q 400 460 380 500 Q 300 460 270 420 Q 230 460 170 510 L 100 520 Z" fill="#2E1C14"/>

    <!-- Neck & Jaw (Sagging Jowls & Platysmal band) -->
    <path d="M 230 360 Q 210 420 190 530 L 370 550 Q 350 440 330 380" fill="url(#skinToneBefore)"/>
    <!-- Platysma Band Laxity (Turkey neck sag) -->
    <path d="M 220 380 Q 210 440 240 480 Q 250 510 240 530" fill="none" stroke="#C28766" stroke-width="5" opacity="0.6"/>
    <path d="M 240 410 Q 245 470 280 520" fill="none" stroke="#C28766" stroke-width="4" opacity="0.5"/>

    <!-- Face Oval (Heavy Jowls, Drooping) -->
    <path d="M 230 100 Q 370 80 390 190 Q 405 260 390 320 Q 365 375 320 395 Q 260 415 220 385 Q 180 340 180 250 Q 180 150 230 100 Z" fill="url(#skinToneBefore)"/>

    <!-- Sagging Jowl bulge at jawline -->
    <path d="M 210 360 Q 200 400 240 405 Q 270 405 290 385" fill="#E6AC8D" opacity="0.7"/>

    <!-- Ear -->
    <path d="M 370 230 Q 400 220 395 260 Q 395 300 375 315 Z" fill="#E8B294" stroke="#C78A69" stroke-width="1.5"/>

    <!-- Eye (Tired, hooded upper lid, under-eye bag) -->
    <g transform="translate(230, 200)">
      <!-- Eyebrow (drooping tail) -->
      <path d="M 0 0 Q 35 -15 70 -5 Q 85 5 90 15" fill="none" stroke="#3D271D" stroke-width="5" stroke-linecap="round"/>
      <!-- Upper lid droop -->
      <path d="M 15 20 Q 45 5 75 22" fill="none" stroke="#683F2C" stroke-width="2.5"/>
      <ellipse cx="45" cy="22" rx="14" ry="10" fill="#4B3621"/>
      <circle cx="48" cy="20" r="4" fill="#FFFFFF"/>
      <!-- Lower eye bag (tear trough sag) -->
      <path d="M 10 32 Q 45 46 80 30" fill="none" stroke="#B87D5C" stroke-width="3" opacity="0.7"/>
    </g>

    <!-- Nose -->
    <path d="M 215 190 Q 195 250 185 285 Q 200 295 215 280" fill="none" stroke="#B87D5C" stroke-width="2.5"/>

    <!-- Deep Nasolabial Fold (Rãnh cười sâu ngoằn ngoèo) -->
    <path d="M 210 270 Q 195 310 220 345" fill="none" stroke="#9E6140" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 213 273 Q 200 310 223 343" fill="none" stroke="#FDE2D0" stroke-width="2" opacity="0.4"/>

    <!-- Drooping Lips & Marionette Line (Khóe miệng trễ & rãnh marionette sâu) -->
    <g transform="translate(195, 325)">
      <path d="M 5 10 Q 25 12 45 10" fill="none" stroke="#B35858" stroke-width="3"/>
      <!-- Down-turned mouth corner -->
      <path d="M 5 10 Q -5 18 -2 28 Q 0 45 15 55" fill="none" stroke="#9E6140" stroke-width="4" opacity="0.8"/>
    </g>
  </g>

  <!-- Clinical Callouts / Watermark -->
  <g transform="translate(30, 40)">
    <rect width="160" height="34" rx="6" fill="#DC2626" opacity="0.9"/>
    <text x="80" y="22" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" letter-spacing="1">TRƯỚC PHẪU THUẬT</text>
  </g>

  <g transform="translate(30, 610)">
    <rect width="540" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#F87171" font-family="sans-serif" font-size="12" font-weight="bold">● Bệnh nhân Nữ, 52 tuổi — Tình trạng trước mổ:</text>
    <text x="20" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11.5">Mỡ má sa trễ độ III, rãnh mũi má &amp; khóe miệng rất sâu, viền hàm mất nét, chùng da cổ nặng.</text>
  </g>
</svg>
